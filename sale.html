<div style="text-align: center; margin: 20px 0;">
  <img 
    src="https://img.shields.io/badge/Оплатить_через-Heleket-blue?style=for-the-badge&logo=bitcoin" 
    id="heleketPayBtn" 
    alt="Оплатить" 
    style="cursor: pointer; transition: transform 0.2s, opacity 0.2s;"
    onmouseover="this.style.transform='scale(1.05)'"
    onmouseout="this.style.transform='scale(1)'"
  >
</div>

<script>
  (function() {
    const payButton = document.getElementById('heleketPayBtn');

    if (!payButton) return;

    payButton.addEventListener('click', async () => {
      payButton.style.opacity = '0.5';
      payButton.style.pointerEvents = 'none';

      try {
        const response = await fetch('https://heleket-payment-proxy.dmitry-gmax.workers.dev/', {
          method: 'POST'
        });

        const data = await response.json();
        console.log("Ответ от сервера:", data);

        const payUrl = data.pay_url || data.url || (data.result && data.result.url) || (data.data && data.data.pay_url);

        if (payUrl) {
          window.location.href = payUrl;
        } else {
          const errorMsg = data.message || data.error || JSON.stringify(data);
          alert('Ошибка при формировании счета: ' + errorMsg);
        }

      } catch (error) {
        console.error('Ошибка сети:', error);
        alert('Не удалось связаться с сервером оплаты.');
      } finally {
        payButton.style.opacity = '1';
        payButton.style.pointerEvents = 'auto';
      }
    });
  })();
</script>
